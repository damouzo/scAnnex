name: Build and push own containers to GHCR

# Own scAnnex images (GSEA, pseudobulk DESeq2, dashboard) are published to GHCR.
# Wave images (scanpy, celltypist, singleR, ...) are not built here; they are
# pulled on-demand by Nextflow from community.wave.seqera.io when the pipeline runs.
#
# Triggers:
#   - push: rebuild only the container(s) whose source changed
#   - workflow_dispatch: manual rebuild (all containers)
on:
  push:
    branches: [master]
    paths:
      - 'containers/gsea/**'
      - 'containers/pseudobulk/**'
      - 'containers/scannex_dashboard/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which container to build'
        required: false
        default: 'all'
        type: choice
        options: [gsea, pseudobulk, dashboard, all]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/scannex
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: Detect changed containers
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      gsea: ${{ steps.filter.outputs.gsea }}
      pseudobulk: ${{ steps.filter.outputs.pseudobulk }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gsea: ['containers/gsea/**']
            pseudobulk: ['containers/pseudobulk/**']
            dashboard: ['containers/scannex_dashboard/**']

  build-gsea:
    name: Build gsea
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect.outputs.gsea == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'gsea' || github.event.inputs.target == 'all'))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/gsea
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - name: Build and push gsea
        uses: docker/build-push-action@v5
        with:
          context: containers/gsea
          file: containers/gsea/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gsea
          cache-to: type=gha,mode=max,scope=gsea

  build-pseudobulk:
    name: Build pseudobulk
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect.outputs.pseudobulk == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'pseudobulk' || github.event.inputs.target == 'all'))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/pseudobulk
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - name: Build and push pseudobulk
        uses: docker/build-push-action@v5
        with:
          context: containers/pseudobulk
          file: containers/pseudobulk/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pseudobulk
          cache-to: type=gha,mode=max,scope=pseudobulk

  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect.outputs.dashboard == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'dashboard' || github.event.inputs.target == 'all'))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/dashboard
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: containers/scannex_dashboard
          file: containers/scannex_dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard