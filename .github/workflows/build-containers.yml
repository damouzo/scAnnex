name: Build and push own containers to GHCR

# Own scAnnex images (GSEA, pseudobulk DESeq2, dashboard) are published to GHCR.
# Wave images (scanpy, celltypist, singleR, ...) are not built here; they are
# pulled on-demand by Nextflow from community.wave.seqera.io when the pipeline runs.
#
# Triggers:
#   - push: rebuild only the container(s) whose source changed
#   - workflow_dispatch: manual rebuild (all componentos)
on:
  push:
    branches: [main]
    paths:
      - 'containers/gsea/**'
      - 'containers/pseudobulk/**'
      - 'containers/scannex_dashboard/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which container to build'
        required: false
        default: 'all'
        type: choice
        options: [gsea, pseudobulk, dashboard, all]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/scannex
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: Detect changed containers
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      gsea: ${{ steps.filter.outputs.gsea }}
      pseudobulk: ${{ steps.filter.outputs.pseudobulk }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gsea: ['containers/gsea/**']
            pseudobulk: ['containers/pseudobulk/**']
            dashboard: ['containers/scannex_dashboard/**']

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [detect]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gsea
            context: containers/gsea
            file: containers/gsea/Dockerfile
            change: gsea
          - name: pseudobulk
            context: containers/pseudobulk
            file: containers/pseudobulk/Dockerfile
            change: pseudobulk
          - name: dashboard
            context: containers/scannex_dashboard
            file: containers/scannex_dashboard/Dockerfile
            change: dashboard
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect.outputs[matrix.change] == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == matrix.name || github.event.inputs.target == 'all'))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}